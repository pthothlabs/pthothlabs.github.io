{{- $p := .Page -}}
{{- $m := site.GetPage (printf "/members/%s" $p.Params.contributor) -}}
<div class="journal-byline">
  <span>{{ $p.Params.emoji }}
  {{ with $m }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ else }}{{ $p.Params.contributor }}{{ end }}
  · {{ $p.Params.role }}</span>
  <a class="journal-byline-back" href="{{ $p.Parent.RelPermalink }}">← {{ with $p.Parent.Params.cohort }}{{ . }} · {{ end }}{{ $p.Parent.Title }}</a>
</div>
