{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<div class="member-grid">
{{ range .Pages.ByWeight }}
<a href="{{ .RelPermalink }}" class="member-card">
  {{ with resources.Get .Params.image }}
  <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" class="member-card-img">
  {{ end }}
  <div class="member-card-name">{{ .Title }}</div>
</a>
{{ end }}
</div>
{{ end }}
